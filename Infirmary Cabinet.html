<style>

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans);overflow:hidden;

.app{height:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding-block:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}

.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:99px;background:var(--ink);color:var(--paper);font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}

.stage:active{cursor:grabbing}
.rig{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.b{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.f{position:absolute;display:flex;align-items:center;justify-content:center;flex-direction:column;font:500 8px/1.2 var(--mono);color:var(--ink);letter-spacing:.04em;overflow:hidden;pointer-events:none}

  over:'ใช้ตามวิธีใช้เท่านั้น', side:'หายใจอึดอัด เหงื่อออก', warn:'ใช้ได้จนกว่าตัวกรองเสื่อมหรือหน้ากากโดนโจมตีจนเสียหาย', taken:'หัวหน้าโปรเจกต์ 1', shape:'mask'},
 {code:'A-06', uses:'single', th:'ชุดปฐมพยาบาลฉุกเฉินและผ้าพันแผลยาชา', en:'First-aid & numbing dressing · ซอง', short:'ปฐมพยาบาล', left:1, kind:'ซองปฐมพยาบาล',
  pack:'1 ชุด (คงเหลือ)', dose:'ใช้ทั้งชุดกับแผลเดียว', hp:'+15 HP · ลดความเจ็บจากแผลสด', over:'ใช้ได้ครั้งเดียว', side:'ผิวระคายเคืองเล็กน้อย', warn:'เหมาะกับแผลถลอก มีดบาด รอยช้ำทั่วไป', taken:'T5L-12 · 1 ชุด', shape:'pouch'},
 {code:'A-07', uses:'single', th:'เข็มฉีดอะดรีนาลีน', en:'Adrenaline injector', short:'อะดรีนาลีน', left:0, kind:'เข็มฉีดอัตโนมัติ',
  pack:'1 เข็ม', dose:'ฉีดทั้งเข็มในครั้งเดียว', hp:'+25 HP · กระตุ้นให้ฝืนขยับในภาวะวิกฤต',
  over:'ใช้ได้ครั้งเดียว', side:'เมื่อหมดฤทธิ์ อ่อนแรงและเหนื่อยล้ากว่าเดิม', warn:'ใช้ในจังหวะหนีหรือสู้เอาตัวรอด', taken:'หัวหน้าโปรเจกต์ 1', shape:'injector'},
 {code:'A-08', uses:'multi', maxUses:3, th:'ยาแก้ปวดฤทธิ์แรง', en:'Strong analgesic · แบบเม็ดหรือฉีด', short:'ยาแก้ปวด', left:3, kind:'ขวดยาสีส้ม (เม็ด)',
  pack:'3 ชุด · ชุดละ 3 เม็ด (รวม 9 เม็ด)', dose:'กิน 1 เม็ดต่อครั้ง (+3 HP) · ชุดใช้ได้ 3 ครั้ง', hp:'+3 HP ต่อเม็ด · ลดปวดชั่วคราว',
  over:'เกิน 3 เม็ดภายใน 1 ชม.: HP ลด 4 · เกิน 6 เม็ด: HP ลด 10 และมึนหมดสติชั่วคราว', side:'ง่วงซึม ตอบสนองช้า', warn:'ไม่รักษาแผลให้หายขาด · ยังตั้งสติและโต้ตอบได้', shape:'pillbottle'},
 {code:'A-09', uses:'single', th:'ถุงเลือดสำรอง / ชุดน้ำเกลือฉุกเฉิน', en:'Blood bag / emergency IV set', short:'เลือด/น้ำเกลือ', left:1, kind:'ถุงห้อยบนขาตั้ง',
  pack:'2 ถุง (คงเหลือ)', dose:'ให้ทั้งถุงในครั้งเดียว', hp:'+30 HP · แก้เสียเลือดมาก หมดแรง หรือขาดน้ำรุนแรง',
  over:'ใช้ได้ครั้งเดียว', side:'มีไข้เล็กน้อยหลังใช้', warn:'ตรวจกลุ่มเลือดก่อนให้', taken:'หัวหน้าโปรเจกต์ 1', shape:'bag'},
 {code:'A-10', uses:'multi', maxUses:3, th:'สเปรย์พ่นทางเดินหายใจ', en:'Airway inhaler', short:'พ่นหลอดลม', left:2, kind:'กระบอกพ่น',
  pack:'2 กระบอก (คงเหลือ)', dose:'พ่น 1 ครั้งต่อการใช้', hp:'+8 HP · บรรเทาแน่นหน้าอกและหายใจไม่ออก',
  over:'ใช้ตามวิธีใช้เท่านั้น', side:'ปากแห้ง มือสั่น', warn:'เปิดทางหายใจชั่วคราว ไม่กันแก๊สในระยะยาว', shape:'inhaler'},
 {code:'A-11', uses:'multi', maxUses:2, th:'น้ำเกลือและยาแก้ปวดพื้นฐาน', en:'Basic saline & analgesic set', short:'น้ำเกลือ', left:5, kind:'ถุงน้ำเกลือบนขาตั้ง',
  pack:'5 ชุด (คงเหลือ)', dose:'ให้ 1 ชุดต่อครั้ง', hp:'+2 ถึง +4 HP ต่อครั้ง · ฟื้นฟูทีละนิด',
  over:'ใช้ตามวิธีใช้เท่านั้น', side:'ปวดบริเวณที่แทงเข็ม', warn:'ตรวจก่อนให้ซ้ำทุกครั้ง', shape:'saline'},
 {code:'A-12', uses:'single', th:'ขวดยาไม่ระบุฉลาก', en:'Unlabelled bottle · ของเหลวขุ่นอมเทา', short:'ไม่มีฉลาก', left:1, kind:'ขวดไม่มีฉลาก',
  pack:'1 ขวด', dose:'ดื่มหรือฉีดทั้งขวดในครั้งเดียว', hp:'สุ่ม −20 ถึง +35 HP',
  over:'ใช้ได้ครั้งเดียว', side:'อาจเกิดปฏิกิริยาตีกลับ HP ลดและอาการทรุดหนักกว่าเดิม', warn:'ไม่มีฉลาก ไม่รู้สูตร เสี่ยงดวง', shape:'dark'}
];
const COLX = [-78, -26, 26, 78], PLATE_Y = [-60, 60, 180];
const W = 250, H = 360, D = 130;
const rig = document.getElementById('rig');
const stage = document.getElementById('stage');

function shade(hex, k) {
  if (hex.startsWith('rgba') || hex === 'transparent') return hex;
  const n = parseInt(hex.slice(1), 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v * k));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function el(p, cls, st) { const d = document.createElement('div'); if (cls) d.className = cls; if (st) Object.assign(d.style, st); p.appendChild(d); return d; }
function box(parent, x, y, z, w, h, d, color, o = {}) {
  const b = el(parent, 'b', { transform: `translate3d(${x}px,${y}px,${z}px)` });
  const faces = [
    ['front', w, h, `translateZ(${d / 2}px)`, color],
    ['back', w, h, `rotateY(180deg) translateZ(${d / 2}px)`, shade(color, .6)],
    ['left', d, h, `rotateY(-90deg) translateZ(${w / 2}px)`, shade(color, .72)],
    ['right', d, h, `rotateY(90deg) translateZ(${w / 2}px)`, shade(color, .78)],
    ['top', w, d, `rotateX(90deg) translateZ(${h / 2}px)`, shade(color, 1.08)],
    ['bottom', w, d, `rotateX(-90deg) translateZ(${h / 2}px)`, shade(color, .5)]
  ];
  faces.forEach(([n, fw, fh, tf, col]) => {
    if (o.onlyFront && n !== 'front') return;
    const f = el(b, 'f ' + n + (o.glass ? ' glass' : ''), {
      width: fw + 'px', height: fh + 'px', left: -fw / 2 + 'px', top: -fh / 2 + 'px', transform: tf,
      background: o.glass ? 'rgba(170,200,230,.28)' : col
    });
    if (o.hit && n === 'front') { f.classList.add('front', 'hit'); f.dataset.id = o.hit; }
  });
  return b;
}

/* cabinet shell */
const ST = '#23354D';
box(rig, 0, -H / 2 + 3, 0, W, 6, D, ST);
box(rig, 0, H / 2 - 3, 0, W, 6, D, shade(ST, .8));
box(rig, -W / 2 + 3, 0, 0, 6, H, D, shade(ST, .9));
box(rig, W / 2 - 3, 0, 0, 6, H, D, shade(ST, .9));
box(rig, 0, 0, -D / 2 + 3, W, H, 6, shade(ST, .6));
[[0, -H / 2 + 3, W, 6], [0, H / 2 - 3, W, 6]].forEach(([x, y, w, h]) => box(rig, x, y, D / 2 - 2, w, h, 4, '#495B7D'));
[[-W / 2 + 3, 0, 6, H], [W / 2 - 3, 0, 6, H]].forEach(([x, y, w, h]) => box(rig, x, y, D / 2 - 2, w, h, 4, '#495B7D'));
box(rig, 0, 0, D / 2 - 2, W - 12, H - 12, 1.5, '#8BA3C5', { glass: true });
PLATE_Y.forEach(y => box(rig, 0, y, 0, W - 12, 5, D - 12, '#495B7D'));

/* shaped models: each builds from boxes sitting on the shelf floor at (x0, floor) */
function model(shape, x0, floor, code) {
  const P = (dx, up, dz, w, h, d, col, o = {}) => box(rig, x0 + dx, floor - 3 - up - h / 2, dz, w, h, d, col, o);
  const hit = code ? { hit: code } : {};
  switch (shape) {
    case 'vial':
      P(0, 0, 0, 22, 22, 22, '#4E9BE0', hit); P(0, 0, 0, 26, 36, 26, '#D6E8F7', { glass: true });
      P(0, 36, 0, 28, 10, 28, '#2F6FB8'); break;
    case 'bottle':
      P(0, 0, 0, 30, 40, 30, '#B07A2A', hit); P(0, 40, 0, 14, 6, 14, '#B07A2A'); P(0, 46, 0, 16, 6, 16, '#E8E2D0');
      P(0, 12, 15.6, 20, 14, 1, '#F8F6EF'); break;
    case 'case':
      P(0, 0, 0, 42, 22, 30, '#F8F6EF', hit); P(0, 22, 0, 42, 3, 30, '#D3D6DA');
      P(0, 9, 15.6, 14, 4, 1, '#B5483F'); P(0, 9, 15.6, 4, 14, 1, '#B5483F'); break;
    case 'device':
      P(0, 0, 0, 40, 30, 28, '#2A3345', hit); P(0, 18, 14.6, 22, 10, 1, '#8BA3C5'); P(-27, 0, 0, 14, 34, 14, '#EDE9DA'); break;
    case 'mask':
      P(0, 0, 4, 16, 14, 16, '#495B7D', hit); P(0, 12, 4, 34, 22, 8, '#D3D6DA'); P(0, 14, 9, 26, 8, 1, '#8BA3C5'); break;
    case 'pouch':
      P(0, 0, 0, 42, 28, 20, '#F8F6EF', hit); P(0, 26, 0, 42, 2, 20, '#8BA3C5');
      P(0, 10, 10.6, 14, 4, 1, '#B5483F'); P(0, 10, 10.6, 4, 14, 1, '#B5483F'); break;
    case 'injector':
      P(0, 0, 0, 12, 34, 12, '#E0867C', hit); P(0, 34, 0, 14, 6, 14, '#495B7D'); P(0, 18, 6.2, 4, 8, 1, '#F8F6EF'); break;
    case 'pillbottle':
      P(0, 0, 0, 32, 26, 32, '#E8C27A', hit); P(0, 26, 0, 34, 8, 34, '#F8F6EF'); P(0, 8, 16.6, 22, 12, 1, '#F8F6EF'); break;
    case 'bag':
      P(-20, 0, 0, 3, 70, 3, '#C4CAD3'); P(-20, 70, 0, 14, 3, 3, '#C4CAD3');
      P(0, 8, 0, 30, 44, 6, '#B5483F', hit); P(0, 2, 0, 2, 8, 2, '#C4CAD3'); break;
    case 'inhaler':
      P(0, 0, 0, 16, 34, 16, '#C4CAD3', hit); P(0, 34, -3, 10, 10, 22, '#495B7D'); break;
    case 'saline':
      P(-22, 0, 0, 3, 64, 3, '#C4CAD3'); P(-22, 64, 0, 14, 3, 3, '#C4CAD3');
      P(0, 26, 0, 34, 46, 6, '#DCE4EF', hit); break;
    case 'dark':
      P(0, 0, 0, 30, 44, 30, '#3A4254', hit); P(0, 44, 0, 12, 8, 12, '#3A4254'); P(0, 52, 0, 14, 6, 14, '#1A1F2A'); break;
  }
}
ITEMS.forEach((it, i) => {
  const r = Math.floor(i / 4), c = i % 4;
  model(it.shape, COLX[c], PLATE_Y[r], it.code);
});

/* rotation */
let ry = -24, rx = -8, drag = null;
let sc = 1;
function apply() { rig.style.transform = `scale(${sc}) rotateX(${rx}deg) rotateY(${ry}deg)`; }
function fit() { const r = stage.getBoundingClientRect(); sc = Math.max(.45, Math.min(r.width / 420, r.height / 470, 1.3)); apply(); }
window.addEventListener('resize', fit);
fit();
stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, ry, rx, moved: false }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  ry = drag.ry + dx * .4; rx = Math.max(-30, Math.min(12, drag.rx - dy * .25)); apply();
});
stage.addEventListener('pointerup', e => {
  if (drag && !drag.moved) {
    const f = document.elementFromPoint(e.clientX, e.clientY);
    const hit = f && f.closest && f.closest('.f.hit');
    if (hit && hit.dataset.id) select(hit.dataset.id);
  }
  drag = null;
});

/* label + tabs */
const tabsEl = document.getElementById('tabs');
const labelBox = document.getElementById('label');
const tabs = {};
function labelHTML(it) {
  const status = it.left === 0 ? 'หมดแล้ว' : it.left <= 1 ? 'เหลือน้อย' : 'มี';
  const cell = (k, v, cls = '') => `<div class="cell ${cls}"><small>${k}</small><p>${v ? v : TODO}</p></div>`;
  return `<div class="lh"><span class="eyebrow">${it.code} · ${it.kind}</span>
    <h2>${it.th}</h2><p class="en">${it.en}</p>
    <div class="chips"><span class="chip">${it.uses === 'single' ? 'ใช้ครั้งเดียวหมด' : 'ใช้ได้ ' + it.maxUses + ' ครั้ง'}</span><span class="chip">${status} · เหลือ ${it.left}</span>${it.taken ? `<span class="chip">นำออก: ${it.taken}</span>` : ''}</div></div>
    <div class="cells">
      ${cell('บรรจุ', it.pack)}${cell('วิธีใช้', it.dose)}
      ${cell('ผลต่อ HP', it.hp, 'hp')}${cell('ถ้าใช้เกิน', it.over, 'warn')}
      ${cell('ผลข้างเคียง', it.side)}${cell('คำเตือน', it.warn)}
    </div>`;
}
ITEMS.forEach(it => {
  const t = el(tabsEl, 'tab');
  t.dataset.code = it.code;
  t.innerHTML = `<span class="tc">${it.code}</span><span class="tn">${it.short}</span><span class="tq ${it.left === 0 ? 'out' : ''}">${it.left === 0 ? 'หมด' : '× ' + it.left}</span>`;
  t.addEventListener('click', () => select(it.code));
  tabs[it.code] = t;
});
function select(code) {
  const it = ITEMS.find(x => x.code === code);
  labelBox.innerHTML = labelHTML(it);
  labelBox.scrollTop = 0;
  Object.values(tabs).forEach(t => t.classList.toggle('sel', t.dataset.code === code));
  rig.querySelectorAll('.f.hit').forEach(f => f.classList.toggle('on', f.dataset.id === code));
}
select('A-01');
const units = ITEMS.reduce((s, it) => s + it.left, 0);
document.getElementById('tKinds').textContent = ITEMS.length;
document.getElementById('tUnits').textContent = units;
document.getElementById('tOut').textContent = ITEMS.filter(it => it.left === 0).length;
document.getElementById('snapDate').textContent = SNAP_DATE;
</script>
</body>
